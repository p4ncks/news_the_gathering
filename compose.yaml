services:
  web:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - news-data:/app/data
    restart: unless-stopped
  collector:
    build: .
    command: ["python", "-m", "news.collect", "--interval", "30"]
    volumes:
      - news-data:/app/data
    restart: unless-stopped
    healthcheck:
      disable: true
volumes:
  news-data:
